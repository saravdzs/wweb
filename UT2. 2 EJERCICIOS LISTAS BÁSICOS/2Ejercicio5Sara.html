<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8"> 
        <title> Ejercicios5</title>
    </head>
    <!-- Ejercicio 5. Diferentes tipos de numeración -->
    <body>
        <ol>
            <li>1</li>
            <li>2</li>
            <li>3</li>
            <li>4</li>
        </ol>

        <ol type="A">
            <li>a</li>
            <li>b</li>
            <li>c</li>
            <li>d</li>
        </ol>
        <ol type="a">
            <li>a</li>
            <li>b</li>
            <li>c</li>
            <li>d</li>
        </ol>
        <ol type="I">
            <li>1.</li>
            <li>2</li>
            <li>3</li>
            <li>4</li>
        </ol>
    </body>
</html>
